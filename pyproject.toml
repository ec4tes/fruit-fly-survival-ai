[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-fly-survival-ai"
version = "0.1.0"
description = "Reproducible PPO experiments with connectome-constrained sparse neural architectures"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "torch>=2.3,<3",
  "gymnasium>=1.0,<1.3", "stable-baselines3>=2.5,<3",
  "networkx>=3.2,<4", "matplotlib>=3.8,<4", "pygame>=2.6,<3",
  "PyYAML>=6.0,<7", "tensorboard>=2.17,<3", "neuprint-python>=0.6.1,<0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
fly-ai = "fly_connectome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
